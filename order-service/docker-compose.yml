services:

  postgres:
    image: postgres:17
    container_name: orderflow-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: orderdb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: orderflow123

    ports:
      - "5432:5432"

    volumes:
      - orderflow-postgres-data:/var/lib/postgresql/data


  kafka:
    image: apache/kafka:4.0.1
    container_name: orderflow-kafka
    restart: unless-stopped

    ports:
      - "9092:9092"

    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller

      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092

      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1

      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0


  redis:
    image: redis:7
    container_name: orderflow-redis
    restart: unless-stopped

    ports:
      - "6379:6379"


  order-service:
    image: orderflow-order-service:latest
    container_name: orderflow-order-service
    restart: unless-stopped

    ports:
      - "8081:8081"

    depends_on:
      - postgres
      - kafka

    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/orderdb
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: orderflow123
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092


  inventory-service:
    image: orderflow-inventory-service:latest
    container_name: orderflow-inventory-service
    restart: unless-stopped

    ports:
      - "8082:8082"

    depends_on:
      - postgres
      - kafka
      - redis

    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/inventorydb
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: orderflow123
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379


  notification-service:
    image: orderflow-notification-service:latest
    container_name: orderflow-notification-service
    restart: unless-stopped

    ports:
      - "8083:8083"

    depends_on:
      - kafka

    environment:
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092


volumes:
  orderflow-postgres-data: